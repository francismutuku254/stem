<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novatech | Registration Page</title>
  <link rel="icon" type="image/x-icon" href="img/image1.png">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
      background: linear-gradient(to right, #3498db, #2ecc71);
      padding: 10px;
    }
    .register-box {
      width: 100%;
      max-width: 600px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
    }
    .register-box h1 {
      color: #03009dff;
      margin-bottom: 20px;
      text-align: center;
      font-size: 1.5rem;
    }
    .register-box img {
      height: 70px;
      width: 70px;
      margin: 20px auto;
      display: block;
    }
    .register-box h4 {
      margin: 10px 0;
      text-align: center;
      font-size: 0.9rem;
      color: #444;
    }
    .register-box h2 {
      margin: 20px 0 10px;
      color: #333;
      text-align: center;
      font-size: 1.2rem;
    }
    .input-container {
      position: relative;
      margin: 15px 0;
    }
    .input {
      height: 45px;
      width: 100%;
      padding: 0 45px 0 15px;
      border: 1px solid #ddd;
      border-radius: 30px;
      background-color: gainsboro;
      outline: none;
      font-size: 1rem;
    }
    .input:focus {
      border-color: green;
      background-color: white;
    }
    .input-icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: grey;
      cursor: pointer;
    }
    #signup {
      width: 100%;
      height: 45px;
      border-radius: 30px;
      background-color: #03009dff;
      color: white;
      cursor: pointer;
      border: none;
      font-size: 1rem;
      margin-top: 20px;
    }
    #signup:hover {
      background-color: grey;
    }
    .login-link {
      margin-top: 20px;
      text-align: center;
    }
    .login-link p {
      font-size: 0.9rem;
    }
    .login-link a {
      color: #03009dff;
      text-decoration: none;
    }
    .login-link a:hover {
      text-decoration: underline;
    }

    /* Media Query for Small Screens */
    @media (max-width: 768px) {
      .register-box {
        padding: 15px;
      }
      .register-box h1 {
        font-size: 1.2rem;
      }
      .input {
        height: 40px;
        font-size: 0.9rem;
      }
      #signup {
        height: 40px;
        font-size: 0.9rem;
      }
      .login-link p {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="register-box">
    <h1>Join Novatech Stem Portal</h1>
    <img src="img/image1.png" alt="Logo">
    <h4>Create your account by filling the form below</h4>
    <h2>Register</h2>

    <form id="registerForm" action="register.php" method="POST" autocomplete="on">
      <div class="input-container">
        <input class="input" type="text" placeholder="Username" id="username" name="username" required>
        <i class='bx bxs-user input-icon'></i>
      </div>
      <div class="input-container">
        <input class="input" type="password" placeholder="Password" id="password" name="password" required>
        <i class="bx bx-hide input-icon" id="toggle-password"></i>
      </div>
      <div class="input-container">
        <input class="input" type="password" placeholder="Confirm Password" id="confirm_password" name="confirm_password" required>
        <i class="bx bx-check-shield input-icon"></i>
      </div>
      <div class="input-container">
        <input class="input" type="tel" placeholder="Phone Number (e.g. 07...)" id="phone" name="phone" required pattern="[0-9]{10,12}">
        <i class="bx bxs-phone input-icon"></i>
      </div>

      <!-- Role Dropdown -->
      <div class="input-container">
        <select class="input" id="role" name="role" required>
          <option value="" disabled selected>Select Role</option>
          <option value="Parent/Campus">Parent/Campus</option>
          <option value="Teacher/Institution">Teacher/Institution</option>
          <option value="Student">Student</option>
        </select>
        <i class="bx bxs-user-detail input-icon"></i>
      </div>

      <!-- School Dropdown (hidden by default) -->
      <div class="input-container" id="school-container" style="display: none;">
        <select class="input" id="school" name="school" required>
          <option value="" disabled selected>Select School</option>
          <option value="RHS Cambridge">RHS Cambridge</option>
          <option value="Novatech Stem">Novatech Stem</option>
          <!-- <option value="RHS Cambridge">RHS Cambridge</option> -->
        </select>
        <i class="bx bxs-school input-icon"></i>
      </div>

      <input id="signup" type="submit" value="Register">

      <div class="login-link">
        <p>Already have an account? <a href="login.html">Login here</a></p>
      </div>
    </form>
  </div>

  <script>
  // Toggle password visibility
  const togglePassword = document.getElementById('toggle-password');
  const passwordInput = document.getElementById('password');

  togglePassword.addEventListener('click', () => {
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    togglePassword.classList.toggle('bx-hide');
    togglePassword.classList.toggle('bx-show');
  });

  // Password match validation
  const registerForm = document.getElementById('registerForm');
  const confirmPasswordInput = document.getElementById('confirm_password');

  registerForm.addEventListener('submit', function (e) {
    if (passwordInput.value !== confirmPasswordInput.value) {
      e.preventDefault();
      alert("Passwords do not match. Please try again.");
      confirmPasswordInput.focus();
    }
  });

  // Show/hide school dropdown + toggle 'required'
  const roleSelect = document.getElementById('role');
  const schoolContainer = document.getElementById('school-container');
  const schoolSelect = document.getElementById('school');

  roleSelect.addEventListener('change', function() {
    if (roleSelect.value === "Student" || roleSelect.value === "Teacher/Institution") {
      schoolContainer.style.display = "block";
      schoolSelect.required = true;
    } else {
      schoolContainer.style.display = "none";
      schoolSelect.required = false; // 👈 disable required for Parent/Campus
      schoolSelect.value = ""; // clear any leftover value
    }
  });
</script>

</body>
</html>
