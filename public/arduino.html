  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { SmartCarIR } from './code/Acebott/QD001/snippets.js';

    const codeContent = getCode();

    const steps = [
    {
        title: "Step 1: Download CH340 Driver for Windows",
        desc: "Download CH340 driver for Windows\nhttps://cdn.sparkfun.com/assets/learn_tutorials/8/4/4/CH341SER.EXE",
        caption: ""
      },
      {
        title: "Step 2: Install CH340 Driver",
        imgs: ["images/Acebott/Arduino-IDE/run-driver-installer.png", "images/Acebott/Arduino-IDE/run-driver-installer2.png"],
        desc: "Run the installer. Follow the prompts to install the driver.",
        caption: ""
      },
      {
        title: "Step 3: Download Arduino IDE",
        img: "images/Acebott/Arduino-IDE/download-ide.png",
        desc: "Download the IDE for Windows.",
        caption: ""
      },
      {
        title: "Step 4: Run IDE Installer",
        imgs: ["images/Acebott/Arduino-IDE/run-ide-installer.png", "images/Acebott/Arduino-IDE/run-ide-installer2.png", "images/Acebott/Arduino-IDE/run-ide-installe3.png", "images/Acebott/Arduino-IDE/run-ide-installer4.png",],
        desc: "Run the executable. Follow the prompts to install Arduino IDE.",
        caption: ""
      },
      {
        title: "Step 5: Run Arduino IDE",
        imgs: ["images/Acebott/Arduino-IDE/run-ide-1.png", "images/Acebott/Arduino-IDE/run-ide-2.png", "images/Acebott/Arduino-IDE/run-ide-3.png"],
        desc: "Open Arduino IDE. Wait for initial setup to complete.",
        caption: ""
      },
      {
        title: "Step 6: Add ESP32 to Board Manager",
        imgs: ["images/Acebott/Arduino-IDE/URL1.png", "images/Acebott/Arduino-IDE/URL2.png", "images/Acebott/Arduino-IDE/URL3.png", "images/Acebott/Arduino-IDE/URL4.png"],
        desc: "Copy this link and paste into 3rd party board manager page field.\nhttps://github.com/arduino/Arduino/wiki/Unofficial-list-of-3rd-party-boards-support-urls",
        caption: ""
      },
      {
        title: "Step 7: Install ESP32 to IDE",
        imgs: ["images/Acebott/Arduino-IDE/board1.png", "images/Acebott/Arduino-IDE/board2.png"],
        desc: "Search for ESP32 board in the board manager. Click install ESP32 board by Espressif Systems.",
        caption: ""
      },
    ];


    let currentStep = 0;

    function showStep(index) {
      const step = steps[index];
      const stepContainer = document.getElementById("step-container");
      stepContainer.classList.add('animate__fadeOut');

      setTimeout(() => {
        document.getElementById("step-title").innerText = step.title;

        // Handle images
        const stepImagesContainer = document.getElementById("step-images");
        stepImagesContainer.innerHTML = "";
        if (step.imgs && step.imgs.length > 0) {
          step.imgs.forEach(src => {
            const imgEl = document.createElement("img");
            imgEl.src = src;
            imgEl.alt = step.title;
            imgEl.classList.add("step-img");
            stepImagesContainer.appendChild(imgEl);
          });
        } else if (step.img) {
          const imgEl = document.createElement("img");
          imgEl.src = step.img;
          imgEl.alt = step.title;
          imgEl.classList.add("step-img");
          stepImagesContainer.appendChild(imgEl);
        }

        if (Array.isArray(step.desc)) {
          // If it's an array, create a list
          let listHTML = '<ol>';
          step.desc.forEach(item => {
            listHTML += `<li>${item}</li>`;
          });
          listHTML += '</ol>';
          // Now, insert the listHTML into your component's paragraph or a new element
          document.getElementById('step-desc').innerHTML = listHTML;
        } else {
          // If it's a string, display it as plain text
          document.getElementById('step-desc').innerHTML = `<p>${step.desc}</p>`;
        }

        document.getElementById("step-caption").innerText = step.caption || "";

        // Handle code block
        if (step.code) {
          document.getElementById("code-block").style.display = "block";
          document.getElementById("arduino-code").innerText = step.code;
        } else {
          document.getElementById("code-block").style.display = "none";
        }

        // Progress bar update
        const progress = ((currentStep + 1) / steps.length) * 100;
        document.getElementById("progress-bar").style.width = progress + "%";
        document.getElementById("progress-label").innerText = `Step ${currentStep + 1} of ${steps.length}`;

        // Update button text on last step
        const nextBtn = document.getElementById("next-btn");
        if (currentStep === steps.length - 1) {
          nextBtn.innerText = "Finish ✅";
        } else {
          nextBtn.innerText = "Next ➡";
        }

        stepContainer.classList.remove('animate__fadeOut');
        stepContainer.classList.add('animate__fadeIn');
      }, 300);
    }

    function nextStep() {
      if (currentStep < steps.length - 1) {
        currentStep++;
        showStep(currentStep);
      } else {
        // Redirect back to intro page
        window.location.href = "arduino_ide_intro.html";
      }
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        showStep(currentStep);
      } else {
        // Redirect back to intro page
        window.location.href = "arduino_ide_intro.html";
      }
    }

    async function copyCode(buttonID) {
      const copyButton = document.getElementById(buttonID);
      const originalText = copyButton.textContent;

      copyButton.textContent = "Copying...";

      try {
        const codeText = getCode();

        if (codeText) {
          await navigator.clipboard.writeText(codeText);

          copyButton.textContent = "Copied!";
          copyButton.style.backgroundColor = "#28a745";

          setTimeout(() => {
            copyButton.textContent = originalText;
            copyButton.style.backgroundColor = "";
          }, 2000);
        } else {
          throw new Error("Failed to get code content.");
        }
      } catch (err) {
        console.error('Copy failed: ', err);
        copyButton.textContent = originalText;
        alert('Failed to copy code.');
      }
    }

    function getCode() {
      return SmartCarIR;
    }

    const copyButton = document.getElementById('copy-button');
    if (copyButton) {
      copyButton.addEventListener('click', () => {
        copyCode('copy-button');
      });
    }

    const nextButton = document.getElementById('next-btn');
    if (nextButton) {
      nextButton.addEventListener('click', () => {
        nextStep();
      });
    }

    const prevButton = document.getElementById('prev-btn');
    if (prevButton) {
      prevButton.addEventListener('click', () => {
        prevStep();
      });
    }

    // Initial load
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }
        
    window.addEventListener('load', () => {          
      const stepParam = getQueryParam("step");
      if (stepParam) {
        const startStep = parseInt(stepParam, 10);
        if (!isNaN(startStep) && startStep >= 0 && startStep < steps.length) {
          currentStep = startStep;
        }
      }
      showStep(currentStep);
    });

     // Hamburger toggle
    const hamburger = document.querySelector(".hamburger");
    const nav = document.querySelector("nav");

    hamburger.addEventListener("click", () => {
      nav.classList.toggle("active");
    });

    // Close nav when clicking outside
    document.addEventListener("click", (e) => {
      if (!nav.contains(e.target) && !hamburger.contains(e.target)) {
        nav.classList.remove("active");
      }
    });
  </script>
