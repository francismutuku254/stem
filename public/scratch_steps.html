  <script>
    const steps = [
      { title: "Step 1 – Open QwEdu App", img: "steps/scratch1.jpg", desc: "Launch the QwEdu app on your tablet or phone to begin programming." },
      { title: "Step 2 – Select BC82 Robot", img: "steps/scratch2.jpg", desc: "From the device list, select the BC82 robot to start your project." },
      { title: "Step 3 – Click the Programming Button", img: "steps/scratch3.jpg", desc: "Tap the 'Programming' button to open the coding interface." },
      { title: "Step 4 – Go to Official Programs", img: "steps/scratch4.jpg", desc: "In the Programming section, choose the 'Official Program' tab to see available projects." },
      { title: "Step 5 – Select Your Project", img: "steps/scratch5.jpg", desc: "Select the project you want to work on, such as the Forklift or Line Follower." },
      { title: "Step 6 – Connect via Bluetooth", img: "steps/scratch6.jpg", desc: "Tap the Bluetooth icon to connect your BC82 robot to the app." },
      { title: "Step 7 – Click Play", img: "steps/scratch7.jpg", desc: "Press the play ▶ button to upload and start your program on the robot." },
      { title: "Step 8 – Explore Events", img: "steps/scratch8.jpg", desc: "Learn about the 'Events' blocks that trigger actions in your Scratch code." },
      { title: "Step 9 – Explore Motion", img: "steps/scratch9.jpg", desc: "Experiment with 'Motion' blocks to move your robot forward, backward, or turn." },
      { title: "Step 10 – Explore Control", img: "steps/scratch10.jpg", desc: "Use 'Control' blocks to loop, wait, or make decisions in your program." },
      { title: "Step 11 – Explore Operators", img: "steps/scratch11.jpg", desc: "Try 'Operators' blocks to perform math, logic, or combine sensor data." },
    ];

    let currentStep = 0;
      function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    function showStep(index) {
      const step = steps[index];
      document.getElementById("step-title").innerText = step.title;
      document.getElementById("step-image").src = step.img;
      document.getElementById("step-desc").innerText = step.desc;

      const progress = ((index + 1) / steps.length) * 100;
      document.getElementById("progress-bar").style.width = progress + "%";
      document.getElementById("progress-label").innerText = `Step ${index + 1} of ${steps.length}`;

      document.getElementById("next-btn").innerText = index === steps.length - 1 ? "Finish ✅" : "Next ➡";
    }

    function nextStep() {
      if (currentStep < steps.length - 1) {
        currentStep++;
        showStep(currentStep);
      }
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        showStep(currentStep);
      } else {
        window.location.href = "scratch.html";
      }
    }

    // Initial load
    window.onload = () => {
      const stepParam = getQueryParam("step");
      if (stepParam) {
        const startStep = parseInt(stepParam, 10);
        if (!isNaN(startStep) && startStep >= 0 && startStep < steps.length) {
          currentStep = startStep;
        }
      }
      showStep(currentStep);
    };
    // Mobile nav toggle
    const hamburger = document.querySelector(".hamburger");
    const nav = document.querySelector("nav");
    hamburger.addEventListener("click", () => nav.classList.toggle("active"));
    document.addEventListener("click", e => { if (!nav.contains(e.target) && !hamburger.contains(e.target)) nav.classList.remove("active"); });
  </script>
