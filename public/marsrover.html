  <style>
    body {

    nav a:hover { color: #d9f7f8; transform: translateY(-2px); }

    /* Hamburger */
    .hamburger {
      display: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #fff;
    }
    @media (max-width: 768px) {
      nav {
        position: absolute;
        top: 60px;

        background: #00979D;
        flex-direction: column;
        gap: 15px;
        width: 200px;
        padding: 20px;
        display: none;
      }

        display: flex;
      }

        display: block;
      }
    }
    #title{
      margin-top: 100px;
    }
    .step-card {
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);

      padding: 20px;
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .step-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    .step-img {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 10px;
      transition: transform 0.3s ease-in-out;

    }
    .step-img:hover {
      transform: scale(1.1);
    }
    .nav-btn {
      border-radius: 20px;

    }
        /* ====== FOOTER ====== */
    footer {
    background: #222;

    padding: 20px;

  }
  .footer-content {

    flex-wrap: nowrap; /* keep everything in one line */

  }
  .footer-content a {
    color: #4CAF50;
    text-decoration: none;
    font-weight: 500;
    white-space: nowrap; /* prevents link breaking into 2 lines */
  }
  .footer-content a:hover {
    text-decoration: underline;
  }

  /* If screen is too small, shrink text instead of breaking */
  @media (max-width: 400px) {
    .footer-content {
      font-size: 0.8rem;
      gap: 4px;
    }
  }
  </style>
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header>
    <div class="logo-container">
      <img src="images/image1.png" alt="Novatech Logo">
      <div>
        <div class="logo-text">Novatech STEM</div>
        <div class="tagline">Electronic Engineering Solutions</div>
      </div>
    </div>
    <div class="hamburger"><i class="fas fa-bars"></i></div>
    <nav>
      <a href="/stem/index.php"><i class="fas fa-home"></i> Home</a>
      <a href="/stem/projects.php"><i class="fas fa-project-diagram"></i> Projects</a>
      <a href="/stem/resources.php"><i class="fas fa-book"></i> Resources</a>
      <a href="/stem/about.php"><i class="fas fa-info-circle"></i> About</a>
      <a href="https://novatech.co.ke/" target="_blank"><i class="fas fa-store"></i> Shop</a>
      <a href="#"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </nav>
  </header>

  <div class="container my-5">
    <h2 class="text-center mb-4" id="title">Mars Rover - Step by Step Guide</h2>

    <!-- Step Content -->
    <div id="step-container" class="step-card">
      <h4 id="step-title">Step 1</h4>
      <img id="step-image" src="steps/mars1.jpg" alt="Step 1 Image" class="step-img my-3">
      <p id="step-desc">Follow the instructions carefully to assemble your Mars Rover.</p>
    </div>

    <!-- Navigation -->
    <div class="d-flex justify-content-between mt-4">
      <button class="btn btn-secondary nav-btn" onclick="prevStep()">⬅ Previous</button>
      <button class="btn btn-primary nav-btn" onclick="nextStep()">Next ➡</button>
    </div>
  </div>
      <!-- ===== FOOTER ===== -->
  <footer>
    <div class="footer-content">
      <span>© <script>document.write(new Date().getFullYear());</script></span>
      <a href="https://novatech.co.ke/" target="_blank">Novatech</a>
      <span>STEM Portal. All rights reserved.</span>
    </div>
  </footer>


  <script>
    const steps = [
      { title: "Step 1", img: "steps/mars1.jpg", desc: "Follow the instructions carefully to assemble your Mars Rover." },
      { title: "Step 2", img: "steps/mars2.jpg", desc: "Continue with the next assembly step." },
      { title: "Step 3", img: "steps/mars3.jpg", desc: "Continue with the next assembly step." },
      { title: "Step 4", img: "steps/mars4.jpg", desc: "Continue with the next assembly step." },
      { title: "Step 5", img: "steps/mars5.jpg", desc: "Continue with the next assembly step." },
      { title: "Step 6", img: "steps/mars6.jpg", desc: "Continue with the next assembly step." },
      { title: "Step 7", img: "steps/mars7.jpg", desc: "Continue with the next assembly step." },
      { title: "Step 8", img: "steps/mars8.jpg", desc: "Continue with the next assembly step." },
      { title: "Step 9", img: "steps/mars9.jpg", desc: "Continue with the next assembly step." },
      { title: "Step 10", img: "steps/mars10.jpg", desc: "Continue with the next assembly step." },
      { title: "Step 11", img: "steps/mars11.jpg", desc: "Continue with the next assembly step." },
      { title: "Step 12", img: "steps/mars12.jpg", desc: "Continue with the next assembly step." },
      { title: "Step 13", img: "steps/mars13.jpg", desc: "Continue with the next assembly step." },
      { title: "Step 14", img: "steps/mars14.jpg", desc: "Continue with the next assembly step." },
      { title: "Step 15", img: "steps/mars15.jpg", desc: "Continue with the next assembly step." },
      { title: "Step 16", img: "steps/mars16.jpg", desc: "Continue with the next assembly step." },
      { title: "Step 17", img: "steps/mars17.jpg", desc: "Continue with the next assembly step." },
      { title: "Step 18", img: "steps/mars18.jpg", desc: "Continue with the next assembly step." },
      { title: "Step 19", img: "steps/mars19.jpg", desc: "Final step of assembling your Mars Rover." }
    ];

    let currentStep = 0;

    function showStep(index) {
      const step = steps[index];
      document.getElementById("step-title").innerText = step.title;
      document.getElementById("step-image").src = step.img;
      document.getElementById("step-image").alt = step.title;
      document.getElementById("step-desc").innerText = step.desc;
    }

    function nextStep() {
      if (currentStep < steps.length - 1) {
        currentStep++;
        showStep(currentStep);
      }
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        showStep(currentStep);
      }
    }

    // Initial load
    window.onload = () => {
      showStep(currentStep);
    };
    // Hamburger toggle
    const hamburger = document.querySelector(".hamburger");
    const nav = document.querySelector("nav");

    hamburger.addEventListener("click", () => {
      nav.classList.toggle("active");
    });

    // Close nav when clicking outside
    document.addEventListener("click", (e) => {
      if (!nav.contains(e.target) && !hamburger.contains(e.target)) {
        nav.classList.remove("active");
      }
    });
  </script>
  

</body>
</html>
